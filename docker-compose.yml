services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tdvh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: tdvh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdvh -d tdvh"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
